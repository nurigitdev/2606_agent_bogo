# BOGO 통신 백본 — Mattermost + Postgres 최초 컨테이너 생성 정의(이식성 핵심).
#
# WHY: infra_up.sh 는 기존 컨테이너의 "기동"만 보장한다. 다른 PC(=컨테이너가 아예
#   없는 상태)에서는 만들 정의가 없으면 봇이 붙을 Mattermost 자체가 존재하지 않는다.
#   이 compose 가 그 공백을 메운다 — git 추적되는 단일 소스로 어느 PC에서든 동일한
#   bogo-pg / bogo-mm 컨테이너(이름·네트워크·포트·DataSource·재시작 정책)를 재현한다.
#
# 계약(infra_up.sh 와 1:1 일치, 깨지면 봇 연결 실패):
#   - 컨테이너 이름 고정: bogo-pg / bogo-mm  (infra_up.sh 가 이 이름으로 inspect/start)
#   - PG 네트워크 별칭 hermes-pg: MM 의 MM_SQLSETTINGS_DATASOURCE 가 hermes-pg 를 참조
#     (레거시 리브랜딩 잔재). compose 가 처음부터 별칭을 부여하므로 infra_up.sh 의
#     ensure_pg_legacy_alias 보정이 사실상 불필요해진다(보정은 안전망으로 유지).
#   - MM 포트 8065 를 127.0.0.1 로만 바인딩(루프백 전용 — 봇은 ws://127.0.0.1:8065).
#   - restart: unless-stopped — Colima/머신 재부팅 시 자동 부활(infra_up.sh 정책과 동일).
#   - 데이터는 named volume 에 영속(컨테이너 재생성에도 채널·계정·메시지 보존).
#
# 사용:
#   docker compose -f docker-compose.yml up -d        # 최초 생성 + 기동
#   docker compose -f docker-compose.yml ps            # 상태
#   docker compose -f docker-compose.yml down          # 중지·제거(볼륨은 보존)
#   docker compose -f docker-compose.yml down -v       # 볼륨까지 삭제(데이터 전체 소거 — 주의)
# infra_up.sh 가 컨테이너 부재를 감지하면 이 파일로 자동 생성한다(아래 ensure_container).
#
# Postgres 비밀번호는 로컬 루프백 전용 DB라 데모 기본값을 둔다. 외부에 노출하지 않는다.
# 운영 강화가 필요하면 .env 의 BOGO_PG_PASSWORD 로 덮어쓴다(아래 ${...:-기본} 참조).

services:
  bogo-pg:
    image: postgres:15-alpine
    container_name: bogo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BOGO_PG_USER:-mmuser}
      POSTGRES_PASSWORD: ${BOGO_PG_PASSWORD:-mmuser_password}
      POSTGRES_DB: ${BOGO_PG_DB:-mattermost}
    volumes:
      - bogo-pg-data:/var/lib/postgresql/data
    networks:
      bogo-net:
        # MM 의 DataSource 가 'hermes-pg' 호스트명을 참조하므로 별칭을 처음부터 부여.
        # 컨테이너 이름 별칭(bogo-pg)은 docker 가 자동 유지한다.
        aliases:
          - hermes-pg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOGO_PG_USER:-mmuser} -d ${BOGO_PG_DB:-mattermost}"]
      interval: 10s
      timeout: 5s
      retries: 10

  bogo-mm:
    image: mattermost/mattermost-team-edition:9.11
    container_name: bogo-mm
    restart: unless-stopped
    depends_on:
      bogo-pg:
        condition: service_healthy
    ports:
      # 바인딩 호스트는 .env 의 MM_BIND_HOST 가 결정한다(기본 127.0.0.1 = 루프백 전용).
      # 단일 PC 모드: 기본값(127.0.0.1)을 그대로 둔다 — 외부 노출 0.
      # 층간(중앙 서버) LAN/Tailscale 모드: 이 PC 의 사내 IP 또는 Tailscale IP(100.x)를
      #   지정해 다른 PC 의 봇·데스크탑 앱이 붙게 한다. 이 모드에선 특정 사설 IP 1개만 쓴다.
      # 멀티홈(다중 NIC 직결) 모드: 한 서버에 NIC 3장을 꽂아 물리 분리된 사내 사설망
      #   A/B/C 에 각각 직결한다. Mattermost(Go http.Server)는 단일 listen 소켓이라
      #   IP 별 다중 바인딩을 못 한다 → 3개 NIC 를 동시에 받으려면 0.0.0.0 이 불가피.
      #   이는 '공인 NIC 부재(공인 IP 0)' 전제에서만 안전하다 — 0.0.0.0 이 사내 3개
      #   사설망에만 노출된다. 인터넷 향 차단은 방화벽으로 이중 가드한다.
      #   활성화: .env 에 MM_BIND_HOST=0.0.0.0 (+ BOGO_MULTIHOME=1 로 의도 명시).
      - "${MM_BIND_HOST:-127.0.0.1}:8065:8065"
    environment:
      # MM 의 DB 연결 — 호스트명 hermes-pg(=bogo-pg 별칭), 자격증명은 PG 와 일치.
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://${BOGO_PG_USER:-mmuser}:${BOGO_PG_PASSWORD:-mmuser_password}@hermes-pg:5432/${BOGO_PG_DB:-mattermost}?sslmode=disable&connect_timeout=10"
      # SITEURL 은 클라이언트(데스크탑 앱·브라우저)가 접속할 표준 주소. 기본 루프백이며,
      # 층간 단일 IP 모드에선 .env 의 MM_SITE_URL 에 중앙 서버 IP 주소(예:
      # http://100.x.x.x:8065 또는 http://192.168.x.x:8065)를 넣는다.
      #
      # [멀티홈 SiteURL 멀티액세스 해결] Mattermost 9.x 는 SiteURL 을 1개만 갖는데,
      # A/B/C 3개 망에서 서로 다른 NIC IP 로 접속하면 다른 IP 의 WebSocket 오리진이
      # Upgrader.CheckOrigin 에서 차단되어 실시간 기능이 깨진다. 공식 해법은
      # AllowCorsFrom 에 추가 오리진을 공백 구분으로 등록하는 것이다(Mattermost KB:
      # "Real-Time Features Not Working When Connecting From Multiple Origins").
      #   → SiteURL 에는 주 망(A: 10/9/8층) IP 를, MM_ALLOW_CORS_FROM 에는 나머지
      #     2개 망(B: 7층, C: 6층) IP 의 http://IP:8065 오리진을 공백 구분으로 넣는다.
      #   예) MM_SITE_URL=http://10.0.0.10:8065
      #       MM_ALLOW_CORS_FROM="http://172.16.0.10:8065 http://192.168.50.10:8065"
      MM_SERVICESETTINGS_SITEURL: "${MM_SITE_URL:-http://127.0.0.1:8065}"
      # 멀티홈 다중 오리진 허용(웹소켓 CheckOrigin·CORS). 기본 빈 값 → 단일 IP 모드는
      # SiteURL 오리진만 허용(회귀 0). 멀티홈에서만 B/C 망 오리진을 공백 구분으로 채운다.
      MM_SERVICESETTINGS_ALLOWCORSFROM: "${MM_ALLOW_CORS_FROM:-}"
      # 봇은 WebSocket/REST 로 붙는다 — 로컬 통신이라 보안설정은 기본값 유지.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    volumes:
      - bogo-mm-config:/mattermost/config
      - bogo-mm-data:/mattermost/data
      - bogo-mm-logs:/mattermost/logs
      - bogo-mm-plugins:/mattermost/plugins
      - bogo-mm-client-plugins:/mattermost/client/plugins
    networks:
      - bogo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8065/api/v4/system/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

networks:
  bogo-net:
    name: bogo-net
    driver: bridge

volumes:
  bogo-pg-data:
  bogo-mm-config:
  bogo-mm-data:
  bogo-mm-logs:
  bogo-mm-plugins:
  bogo-mm-client-plugins:
